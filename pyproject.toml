[project]
name = "eimemory"
version = "1.11.28"
description = "Local-first memory and evolution runtime for OpenClaw and eibrain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
eimemory = "eimemory.cli.main:main"
eimemory-qmd = "eimemory.adapters.openclaw.qmd_compat:main"

[project.entry-points."eimemory.capability_catalog.bootstrap.v1"]
hongtu = "eimemory.evaluation.hongtu_catalog:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eimemory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: high-volume or performance-sensitive tests",
  "linux_deployment: Linux/POSIX deployment and filesystem security contracts",
]
