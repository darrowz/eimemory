name: Linux deployment contracts

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  linux-deployment-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test runner
        run: python -m pip install '.[pdf]' pytest

      - name: Run Linux deployment and filesystem contracts
        run: >-
          python -m pytest -q --strict-markers
          tests/test_deployment_tools.py
          tests/test_governance_env.py
          tests/test_payload_segments.py
          tests/test_production_recall_bootstrap_deploy.py
          tests/test_safe_dataset_loader.py
          tests/test_nightly_evidence_workflow.py
          tests/test_controlled_memory_benchmark.py
          tests/test_memory_benchmark_context.py
          tests/test_nightly_controlled_memory_benchmark.py
          tests/test_knowledge_gap_review.py
          tests/test_capability_hypothesis_producer.py
          tests/test_dynamic_code_patch_context.py
          tests/test_capability_acceptance.py
          tests/test_capability_catalog_registration_transfer.py
          tests/test_code_evolution_effects.py
          tests/test_code_automation_policy_v2.py
          tests/test_nightly_evolution_path_diagnostics.py
          tests/test_nightly_business_diagnostics.py
          tests/test_nightly_review_references.py
          tests/test_nightly_collection_diagnostics.py
          tests/test_research_review_hermes.py
          tests/test_hermes_tool_free.py
          tests/test_eibrain_rpc_contract.py
          tests/test_rpc_health_probe_bounds.py
          tests/test_storage_deploy.py
