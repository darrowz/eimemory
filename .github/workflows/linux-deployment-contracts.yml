name: Linux deployment contracts

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_ADDOPTS: '-p no:cacheprovider'

jobs:
  linux-deployment-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test runner
        run: python -B -m pip install --no-compile '.[pdf]' pytest

      - name: Verify protected Unix operator authority with actual root permissions
        run: >-
          sudo env PYTHONDONTWRITEBYTECODE=1
          EIMEMORY_SYSTEM_SETTINGS_PATH=/tmp/eimemory-ci-no-system-settings.json
          "$(command -v python)" -B -m pytest -q -p no:cacheprovider --strict-markers
          tests/test_identity_governance.py

      - name: Run Linux deployment and filesystem contracts
        run: >-
          python -B -m pytest -q --strict-markers
          tests/test_deployment_tools.py
          tests/test_deployment_receipt.py
          tests/test_hermes_gateway_restart_boundary.py
