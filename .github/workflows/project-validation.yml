  repository-regression:
    # The operator disabled full-repository CI; focused release gates remain active.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -B -m pip install --no-compile '.[pdf]' pytest pytest-xdist
      - name: Run every standard repository test
        run: >-
          python -B -m pytest --strict-markers -q -ra
          -n 4 --dist=loadfile -m 'not slow'
          --basetemp=${{ runner.temp }}/pytest-eimemory-standard
          --junitxml=${{ runner.temp }}/eimemory-repository-tests.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-tests-${{ github.sha }}
          path: ${{ runner.temp }}/eimemory-repository-tests.xml
          if-no-files-found: error
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install and record resolved dependencies
        shell: bash
        run: |
          python -B -m pip install --no-compile '.[pdf,postgres]' pip-audit
          mkdir -p "$RUNNER_TEMP/eimemory-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/eimemory-audit/commit.txt"
          python -B -m pip freeze --all > "$RUNNER_TEMP/eimemory-audit/resolved.txt"
      - name: Audit known advisories, preserving nonzero failures
        shell: bash
        run: |
          set -o pipefail
          python -B -m pip_audit --local --format json \
            --output "$RUNNER_TEMP/eimemory-audit/pip-audit.json" \
            2>&1 | tee "$RUNNER_TEMP/eimemory-audit/audit.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/eimemory-audit/
          if-no-files-found: error
