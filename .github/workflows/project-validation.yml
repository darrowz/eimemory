name: Project validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_ADDOPTS: '-p no:cacheprovider'

jobs:
  business-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -B -m pip install --no-compile . pytest
      - name: Verify core business closure
        run: >-
          python -B -m pytest -q --strict-markers
          tests/test_business_closure_feedback.py
          tests/test_storage.py
          tests/test_runtime_store_transaction_ownership.py
          tests/test_terminal_atomicity.py
          tests/test_runtime_terminal_evidence.py
          tests/test_experience_outcome.py
          tests/test_recall_engine.py
          tests/test_knowledge_compiler.py
          tests/test_knowledge_projectors.py
          tests/test_knowledge_projector_bounds.py
          tests/test_knowledge_refresh.py
          tests/test_promotion_safety.py
          tests/test_promotion_manager.py
          tests/test_release_closure.py
          tests/test_release_closure_failure.py
          tests/test_l5_readiness.py
          tests/test_business_closure_bc.py
          tests/test_business_closure_audit_regressions.py
          tests/test_real_effect_signals.py
          tests/test_real_effect_report.py
          tests/test_real_effect_hypotheses.py
          tests/test_test_rule_quarantine.py
          tests/test_learning_loop_terminal_contracts.py
          tests/test_semantic_relevance_monitor.py
          tests/test_recall_companion.py
          tests/test_production_query_dataset.py
          tests/test_production_query_auto_review.py
          tests/test_b1_runtime_outcome_closed_loop.py
          tests/test_minimal_closed_loop.py
          tests/test_quality_loop_130.py
          tests/test_promotion_watch_checkpoints.py
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install and record resolved dependencies
        shell: bash
        run: |
          python -B -m pip install --no-compile '.[pdf,postgres]' pip-audit
          mkdir -p "$RUNNER_TEMP/eimemory-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/eimemory-audit/commit.txt"
          python -B -m pip freeze --all > "$RUNNER_TEMP/eimemory-audit/resolved.txt"
      - name: Audit known advisories, preserving nonzero failures
        shell: bash
        run: |
          set -o pipefail
          python -B -m pip_audit --local --format json \
            --output "$RUNNER_TEMP/eimemory-audit/pip-audit.json" \
            2>&1 | tee "$RUNNER_TEMP/eimemory-audit/audit.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/eimemory-audit/
          if-no-files-found: error
