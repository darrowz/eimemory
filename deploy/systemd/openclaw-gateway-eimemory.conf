# Managed by eimemory immutable release installer
[Service]
EnvironmentFile=-@EIMEMORY_EVIDENCE_RECEIPT_ENV_FILE@
EnvironmentFile=-/etc/eimemory/rpc.env
EnvironmentFile=-/etc/eimemory/recall.env
Environment=EIMEMORY_ROOT=/var/lib/eimemory
Environment=EIMEMORY_CONFIG_DIR=/etc/eimemory
Environment=EIMEMORY_RUNTIME_COMMIT=@EIMEMORY_COMMIT@
Environment=EIMEMORY_RUNTIME_RELEASE_DIR=/opt/eimemory/current
# These absolute eiMemory commands own their Python import surface without
# changing the gateway or its children's environment and runtime permissions.
Environment="EIMEMORY_HOOK_COMMAND=/opt/eimemory/current/.venv/bin/eimemory openclaw-hook"
Environment="EIMEMORY_BRIDGE_COMMAND=/opt/eimemory/current/.venv/bin/eimemory ei-bridge feishu"
Environment=EIMEMORY_RPC_URL=http://127.0.0.1:8091/
Environment=EIMEMORY_RPC_HOOK_TIMEOUT_MS=3500
Environment=EIMEMORY_ENABLE_PROMPT_INJECTION=1
Environment=EIMEMORY_ENABLE_PROMPT_BRIDGE=0
Environment=EIMEMORY_BEFORE_PROMPT_BUDGET_MS=22000
