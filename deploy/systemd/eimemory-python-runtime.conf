# Managed by eimemory immutable release installer
[Service]
EnvironmentFile=-/etc/eimemory/governance.env
EnvironmentFile=-/etc/eimemory/recall.env
EnvironmentFile=-@EIMEMORY_EVIDENCE_RECEIPT_ENV_FILE@
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=PYTHONPYCACHEPREFIX=/var/lib/eimemory/.pycache/@EIMEMORY_COMMIT@
Environment=EIMEMORY_RUNTIME_COMMIT=@EIMEMORY_COMMIT@
# Final-authority rewrite on every switch: clear profile-specific stale values
# (absolute prior release dirs, Tailscale RPC URLs) with the current identity.
Environment=EIMEMORY_RUNTIME_RELEASE_DIR=/opt/eimemory/current
Environment=EIMEMORY_RPC_URL=http://127.0.0.1:8091/
# Gateways/RPC protect all releases across current-link changes; trusted jobs
# protect their bound release while retaining candidate-build access.
# User managers require unprivileged user/mount namespace support. A host that
# cannot establish this sandbox must fail startup, not silently run writable.
PrivateUsers=yes
ReadOnlyPaths=@EIMEMORY_READONLY_RELEASE_PATH@
# Verify the effective mount before executing any entrypoint. This inline
# stdlib check also works when rolling back to releases predating the helper.
ExecStartPre=@EIMEMORY_RELEASES_ROOT@/@EIMEMORY_COMMIT@/.venv/bin/python -I -B -c "import os,sys; sys.exit(0 if os.statvfs(sys.argv[1]).f_flag & os.ST_RDONLY else 'immutable_release_mount_not_readonly')" @EIMEMORY_RELEASES_ROOT@/@EIMEMORY_COMMIT@
