# older release. Every standalone gateway uses this same locked host contract.
ExecStartPre=@EIMEMORY_HERMES_BOUNDARY_PYTHON@ -I -B @EIMEMORY_HERMES_BOUNDARY_HELPER@ --hermes-agent-root @EIMEMORY_HERMES_BOUNDARY_HOST_ROOT@ --apply --startup
